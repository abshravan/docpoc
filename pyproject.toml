[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-cds"
version = "0.1.0"
description = "EPL-CDS: LLM-assisted clinical decision support for early pregnancy loss (research/validation study)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "Flask>=3.0"]
webapp = ["Flask>=3.0"]
anthropic = ["anthropic>=0.39"]
# OCR also needs the system `tesseract` binary (and poppler for scanned PDFs).
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0", "pdf2image>=1.17", "pypdf>=4.0"]

[tool.setuptools.packages.find]
include = ["epl_cds*", "webapp*"]

[tool.setuptools.package-data]
"epl_cds.knowledge" = ["*.yaml"]
"webapp" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
